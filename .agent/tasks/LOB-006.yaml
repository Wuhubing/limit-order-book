constraints:
  - Zero behavior change to public API, semantics.md semantics, fill events, snapshot output, or pool allocator behavior
  - Engine hot paths must stop calling recursive getLimitHeight (grep-clean); getLimitHeight itself stays for tests/harness
  - AVLTreeBalanceCount rotation-counting behavior unchanged
  - I6 (true-height AVL check in DifferentialTests) must pass on every differential run — it is the cache-drift backstop
  - Existing suites green untouched (except the allowed EngineCorrectnessTests additions)

acceptance:
  - All suites pass under Release and UBSan, including the full differential fuzz with I6
  - balance()/limitHeightDifference()/rebalance paths use cached heights (no recursion on hot paths)
  - Height cache maintained across insert/delete/rotate paths incl. the successor==right-child delete case and stop trees
  - Bench deltas recorded for >=4 loads (incl. large_low_density) in results/stageD/ with raw JSONs committed
  - Honest statement: per-load measured deltas and any regression noted

