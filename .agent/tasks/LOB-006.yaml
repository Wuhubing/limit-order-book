    - test/CMakeLists.txt
    - results/stageD/**
  forbidden:
    - reference/**
    - tools/**
    - test/LimitOrderBookTests.cpp
    - test/ExampleOrdersTests.cpp
    - test/DifferentialTests.cpp
    - bench/**
    - scripts/**
