task_id: LOB-002

goal: |
  Stage B1 — Turn the upstream engine into the documented "engine v1": apply the
  correctness overhaul specified by docs/semantics.md and docs/issues-register.md
  to the Limit_Order_Book core. Method: for EVERY behavioral fix, first commit a
  reproducing test (RED on current code), then commit the fix (GREEN). Commit
  themes must stay separable: (1) repro tests, (2) engine fixes, (3) events +
  introspection API + input validation with their tests. All commits on this
  branch, never push.

context: |
  YOUR WORKING ROOT IS THE WORKTREE YOU ARE RUNNING IN. Use ONLY relative paths
  from that root (docs/, Limit_Order_Book/, test/, ...). Everything you need —
  sources, tests, docs/semantics.md, docs/issues-register.md, CMakeLists.txt — is
  a subdirectory of the worktree; do NOT reference the parent repository path, it
  will be treated as external and file access will be rejected. Confirm with `pwd`
  and `ls` first.

  Base already includes LOB-001's
  build bootstrap (googletest via FetchContent when googletest/ absent) — configure
  with: export PATH="/opt/homebrew/bin:$PATH" (cmake/ninja live there) then
  `cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release && cmake --build build -j8`.
  macOS 26.4.1 / Apple clang 16. ASan+UBSan available via -fsanitize=address,undefined
  (NOTE: no LeakSanitizer on macOS — use ASAN_OPTIONS=detect_leaks=0; leak checks
  happen later on Linux CI).

  AUTHORITATIVE SPEC: read docs/semantics.md (engine v1 behavior) and
  docs/issues-register.md (numbered issues with file:line evidence) FIRST.
  Implement exactly that spec. Where semantics.md says [FIX], upstream behavior is
  wrong and you change the engine. Where it documents upstream behavior WITHOUT
  [FIX], keep upstream behavior identical.

  Files & current state you will touch (read before editing):
  - Limit_Order_Book/Book.hpp|cpp: Book dtor (Book.cpp:13) deletes orders via
    orderMap then limits via unordered_map iteration order; ~Limit does BST pointer
    surgery on delete (Limit.cpp:10-96) so deleting a child before its parent
    dereferences freed nodes (issue #6). deleteLimit (Book.cpp:742) /
    deleteStopLevel (Book.cpp:768) currently rely on destructor surgery then
    rebalance ancestors of the deleted node only; the in-order-successor splice
    path inside the subtree never gets rebalanced, so AVL can silently degrade and
    updateBookEdgeRemove (Book.cpp:638) edge heuristics can then point at a
    non-extreme level (issue #2). FIX DIRECTION (yours to implement cleanly):
    make Limit's destructor inert (no tree surgery); move ALL tree removal logic
    into Book-side delete functions implementing classic AVL node deletion:
    successor splice + rebalance starting from the successor's ORIGINAL parent
    (when successor != deleted node's right child) AND from the deleted node's
    parent, walking to the root, re-attaching rotated roots correctly. The same
    rework applies to the stop-tree twins (deleteStopLevel/changeStopBookRoots/
    updateStopBookEdgeRemove/balanceStop rotations). Book::~Book must teardown
    trees traversal-ordered (children before parents) and free every order exactly
    once, no reliance on tree pointers inside destructors.
  - modifyLimitOrder (Book.cpp:132): after cancel-and-replace, a modified order
    whose new limit crosses must execute aggressively like an AddLimit (fills +
    remainder rests at new limit, tail). Currently it rests crossed (issue #3).
  - addLimitOrder/marketOrder/cancelLimitOrder/modifyLimitOrder public entries:
    add validation per semantics.md (id>0, qty>0, price>0 for add/modify, no live
    duplicate id; violations => silent reject, zero state change). Market: qty>0.
    Cancel/modify of unknown id: silent no-op. Remove the std::cout prints from
    searchOrderMap/searchLimitMaps/searchStopMap (Book.cpp:300-341) — engine is
    print-free; return nullptr silently. Do NOT touch the other print*/traversal
    visualization functions or the stop/market internals beyond the AVL delete
    rework.
  - Order.hpp/cpp: add `Order* getNextOrder() const;` accessor (needed for level
    queue walking). Order::cancel (Order.cpp:41) already unlinks correctly.
  - Fill events + introspection: add to Book.hpp a public
    `struct FillEvent { int aggressorId; int restingId; int price; int qty; bool
    aggressorBuy; uint64_t seq; };`, `void setFillSink(std::vector<FillEvent>*)`
    (nullptr = disabled, zero-cost when disabled: one branch per fill site, no
    allocation when null), and emit exactly one FillEvent per trade in execution
    order from marketOrderHelper (Book.cpp:1002) covering BOTH full-consumption
    loop iterations and the final partial fill; seq is a monotonically increasing
    engine-lifetime counter. Also add `struct OrderState { int id; int qty; };`
    `struct LevelState { int price; bool side; long long totalVolume;
    std::vector<OrderState> orders; };` (orders in FIFO head->tail order) and
    `std::vector<LevelState> snapshot() const;` returning buy levels (ascending
    price) followed by sell levels (ascending price) — walk the existing
    trees/maps with public getters; this is the state-introspection API for
    differential testing and MUST be exact (it is the oracle interface).
    Keep executedOrdersCount/AVLTreeBalanceCount behavior identical (upstream
    tests read them). Stop paths: also wire fill emission through their existing
    marketOrderHelper calls (aggressorId 0 for system aggressor, as documented).
  - test/CMakeLists.txt: add the new test file to the test executable sources.
  - test/EngineCorrectnessTests.cpp (NEW): gtest file driving Book through its
    public API ONLY (plus setFillSink/snapshot), covering at minimum: duplicate-id
    add rejected then id reusable after cancel; modify-to-crossing executes and
    leaves no cross (semantics I5) incl. remainder resting at the new limit;
    same-price modify loses FIFO priority (re-inserted at tail); market remainder
    dropped on insufficient liquidity; cancel of head/middle/tail/last order at a
    level with level removal and map cleanup; partial fill keeps the head order in
    place; multi-level aggressive sweep fills each level at its own price, FIFO
    within level, exact-boundary exhaustion; empty book and one-sided book ops are
    safe no-ops; every validation reject leaves state and event stream untouched;
    fill events emitted with correct price/qty/order ids/ordering and monotonic
    seq; snapshot matches state asserted through existing getters; modify with
    invalid args keeps the order unchanged. Where the current engine is buggy
    (duplicate id, modify crossing, prints are irrelevant to asserts) the tests
    must FAIL before your fix commit and PASS after — commit order proves it.

  Honesty rules: never claim a test passed that did not run. If an upstream
  regression test (test/LimitOrderBookTests.cpp, test/ExampleOrdersTests.cpp —
  DO NOT EDIT either file) fails after your changes, that is a real regression:
  fix the ENGINE, not the test. Existing tests must stay green (they exercise
  stop paths heavily — the AVL delete rework must preserve them).

  RESUME STATE (important — a previous session was interrupted mid-work):
  - The repro-tests commit exists: c25f5b7 (test/CMakeLists.txt adds an
    EngineCorrectnessTests target; test/EngineCorrectnessTests.cpp has RED tests
    for duplicate-id reject and modify-to-crossing).
  - UNCOMMITTED engine work is present in the working tree right now:
    Limit_Order_Book/Book.cpp (~313 changed lines), Book.hpp, Limit.cpp
    (destructor surgery removed). This is the bulk of the fix, mid-edit and NOT
    YET DEBUGGED: with these edits the upstream suite CRASHES (exit 139, SIGSEGV)
    at LimitOrderBookTests.TestAddingSellLimitOrderWhichIsAMarketOrder — at the
    clean commit the same tests pass. DO NOT discard or reset this work; keep it,
    debug it, finish it, and commit it in logical fix commits (theming per the
    goal). Verify with a clean incremental rebuild that the crash is gone and
    both suites pass before committing.
  - CRITICAL PATH RULE: never read from or write to /tmp or any path outside the
    worktree — permission is auto-rejected and the session dies. Keep ALL scratch,
    logs, backups, and outputs inside the worktree (e.g. .agent/results/scratch/,
    build/, test logs). For a pre-edit backup use `cp Book.cpp .agent/results/scratch/`.
  - The engine work may be incomplete vs docs/semantics.md (e.g. validation,
    fill-sink, snapshot, getNextOrder may be missing or half-done) — audit the
    working tree against semantics.md and finish everything listed in the goal.

