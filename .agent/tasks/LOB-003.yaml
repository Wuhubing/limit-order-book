    - tools/diff_fuzz.cpp
    - test/CMakeLists.txt
    - test/DifferentialTests.cpp
    - testdata/**
  forbidden:
    - Limit_Order_Book/**
    - test/LimitOrderBookTests.cpp
    - test/ExampleOrdersTests.cpp
    - test/EngineCorrectnessTests.cpp
    - Process_Orders/**
    - Generate_Orders/**
    - main.cpp
    - CMakeLists.txt
    - .agent/**
    - docs/**
    - .worktrees/**

constraints:
  - Engine (Limit_Order_Book/**) is FROZEN: zero modifications, even if differential tests fail
  - Reference model must not include or copy engine code; standard library only
  - Do not edit existing test files or docs
  - No new dependencies
  - Deterministic: same seed => identical corpus => identical results on both sides and across runs

acceptance:
  - reference/ implements semantics.md and passes its own unit scenarios
  - Differential suite runs >=20 seeds x >=2000 requests, comparing events AND state after EVERY request, plus I1-I7 invariant checks
  - Any mismatch yields: failing gtest, saved corpus, minimized corpus, seed + request index in the failure text
  - Corpus parser <-> generator round-trip is exact; determinism self-check passes
  - 3 small corpora committed under testdata/corpora/ with seeds documented
  - tools/diff_fuzz generates and replays corpora; replay exit codes as specified
  - Release AND ASan+UBSan builds both run the full new suite green (or, if a genuine engine bug is found, the specific minimized-case test FAILS and is reported — never silently hidden)

verification:
  - export PATH="/opt/homebrew/bin:$PATH" && cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release && cmake --build build -j8
  - 'export PATH="/opt/homebrew/bin:$PATH"; ./build/test/DifferentialTests --gtest_color=no --gtest_output=xml:.agent/results/LOB-003-diff.xml > .agent/results/LOB-003-diff.log 2>&1; echo "diff-suite exit=$?"'
  - 'export PATH="/opt/homebrew/bin:$PATH"; ./build/test/EngineCorrectnessTests --gtest_color=no > .agent/results/LOB-003-engine.log 2>&1; echo "engine-suite exit=$?"'
  - 'export PATH="/opt/homebrew/bin:$PATH"; cmake -B build-asan -G Ninja -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" && cmake --build build-asan -j8'
  - 'export PATH="/opt/homebrew/bin:$PATH"; ASAN_OPTIONS=detect_leaks=0 ./build-asan/test/DifferentialTests --gtest_color=no > .agent/results/LOB-003-diff-asan.log 2>&1; echo "asan-diff exit=$?"'
  - 'test -f reference/ReferenceBook.hpp && test -f reference/Command.hpp && test -f tools/diff_fuzz.cpp'
  - 'ls testdata/corpora/*.txt | wc -l | grep -qE "[3-9]"'
  - git log --oneline -4

risk: high
