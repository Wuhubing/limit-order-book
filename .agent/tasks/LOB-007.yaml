task_id: LOB-007

goal: |
  Stage E — deterministic replay tooling + Linux CI. Deliver:
  (1) a replay CLI (`tools/replay`) that consumes a canonical corpus file (same
  Add/Mkt/Cxl/Mod format as reference/Command.hpp), runs it through the ENGINE
  only (no reference model needed at runtime) and emits a deterministic, canonical
  OUTPUT RECORD = sorted summary of the full logical state at the end PLUS the
  complete FillEvent stream (every fill: aggressorId restingId price qty side seq)
  plus per-op stats (counts by op, fills, rejects). Same input => byte-identical
  output record, independent of build/run (no timestamps, no pointers, no hashing
  order that depends on map iteration — orderMap iteration is nondeterministic,
  so derive the summary from Book::snapshot() which is deterministic).
  (2) a small set of committed golden traces: for a few corpora (the 3 testdata
  corpora + 2-3 adversarial ones), the canonical output record is committed as a
  .golden file; a `--check-golden` mode replays and diffs against the golden file
  (exit 0 match / 1 mismatch with diff). This pins determinism across platforms
  and future engine changes.
  (3) GitHub Actions CI (workflow file) that on push/PR: builds (cmake+ninja,
  Release and Debug), runs ALL suites (LimitOrderBookTests, EngineCorrectnessTests,
  DifferentialTests incl. the 20-seed differential fuzz), runs the replay golden
  checks, and runs an ASan+LSan build+suite (Linux runners have working ASan, which
  the macOS host lacks — this closes the deferred memory-safety verification from
  LOB-002/003). Explicitly NO performance gates in CI (shared-host perf variance);
  bench is not part of CI.

context: |
  YOUR WORKING ROOT IS THE WORKTREE. Relative paths only; never the parent repo
  path; never /tmp. BUILD: export PATH="/opt/homebrew/bin:$PATH" && cmake -B build
  -G Ninja -DCMAKE_BUILD_TYPE=Release && cmake --build build -j8. Test binaries
  under build/test/ (LimitOrderBookTests 123, EngineCorrectnessTests 20,
  DifferentialTests 19). tools/diff_fuzz exists (generate/replay differential);
  your tools/replay is the ENGINE-ONLY single-binary replay (diff_fuzz requires the
  reference model; replay must not). Engine is at its final optimized state
  (object pools + cached AVL heights); DO NOT modify Limit_Order_Book/**.

  Design guidance:
  - Reuse: reference/Command.hpp + Command.cpp (parseCorpus) and
    Limit_Order_Book/Book.hpp (engine; setFillSink). Do not edit either.
  - Deterministic output record format (plain text, stable field order):
    header line: `replay v1 <num_requests> <fill_count> <op_counts A/M/C/Mkt>`
    then one line per fill in seq order: `fill <seq> <aggressorId> <restingId> <price> <qty> <side>`
    then final state block from Book::snapshot(): buy levels ascending then sell
    levels ascending: `level <side> <price> <totalVolume> <nOrders> id:qty,id:qty,...`
    (orders in FIFO head->tail). Empty state => `state empty`.
  - Golden files under testdata/golden/<corpus-name>.golden, generated by
    `tools/replay --emit-golden` from the committed corpora
    (testdata/corpora/*.txt incl. adversarial/). Commit them.
  - `tools/replay --replay <corpus> --golden <file>`: compare and report; exit 0/1.
  - stats (op counts, rejects) reported on stderr or in record? Put reject count in
    the header line (rejects = validation rejects; engine exposes them only via
    absence of effect, so count them by replaying with a wrapper that counts ops
    whose... simpler: record op counts only; rejects are deterministically
    reflected in fills+state anyway — state the choice in the code comment).
  - CMake: add the replay tool target (and any needed sources) — allowed to touch
    CMakeLists.txt and add files under tools/.
  - CI: .github/workflows/ci.yml — ubuntu-latest, checkout, cmake -B build -G
    Ninja -DCMAKE_BUILD_TYPE=Release, build, run the three suites, run replay
    golden checks (loop over testdata/golden/*.golden), then a Debug ASan+LSan
    config: CXXFLAGS=-fsanitize=address,undefined -fno-omit-frame-pointer, build,
    run the three suites with detect_leaks=1. Use the googletest FetchContent
    bootstrap already in CMakeLists (no vendoring). Pin actions versions
    (actions/checkout@v4, actions/setup-python not needed). Fail job on any suite
    mismatch. No bench, no perf assertions. Keep it readable and commented.
  - The canonical corpus parser rejects comments/blank lines — golden corpora are
    the existing committed ones.

  Honesty rules: never claim a check passed that did not run; CI is declarative —
    state exactly which commands run; do not weaken any suite or filter tests.

worker:
  type: deep

scope:
  allowed:
    - tools/replay.cpp
    - CMakeLists.txt
    - .github/workflows/ci.yml
    - testdata/golden/**
    - testdata/README.md
  forbidden:
    - Limit_Order_Book/**
    - reference/**
    - tools/diff_fuzz.cpp
    - test/**
    - bench/**
    - scripts/**
    - Process_Orders/**
    - Generate_Orders/**
    - main.cpp
    - .agent/**
    - docs/**

constraints:
  - Do not modify the engine, reference model, existing tools, or any test source
  - Golden output must be generated from real replay runs (never hand-written); generation command recorded in testdata/README.md
  - replay must not depend on the reference model sources at link time
  - No performance gates or benchmark steps in CI
  - Do not run the CI workflow here (GitHub-hosted) — deliver the file; note that it runs on push to the user's remote

acceptance:
  - tools/replay builds and replays any canonical corpus to a deterministic record; same input twice => byte-identical output
  - Golden files committed for >=5 corpora (mix-heavy, cancel-heavy, market-heavy + >=2 adversarial); --check-golden matches on this machine
  - Golden regeneration is one documented command
  - .github/workflows/ci.yml runs build + 3 suites + golden checks + ASan/LSan suites on ubuntu-latest; no perf gates
  - Existing suites still green; no changes to engine/tests

verification:
  - export PATH="/opt/homebrew/bin:$PATH" && cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release && cmake --build build -j8
  - 'export PATH="/opt/homebrew/bin:$PATH"; ./build/tools/replay --help > /dev/null 2>&1; echo "replay-help exit=$?"'
  - 'export PATH="/opt/homebrew/bin:$PATH"; ls testdata/golden/*.golden | wc -l | grep -qE "[5-9]"'
  - 'export PATH="/opt/homebrew/bin:$PATH"; ok=1; for g in testdata/golden/*.golden; do c=${g%.golden}; ./build/tools/replay --replay "$c" --golden "$g" > /dev/null 2>&1 || ok=0; done; echo "golden-matches=$ok"; test "$ok" = 1'
  - 'export PATH="/opt/homebrew/bin:$PATH"; ./build/test/DifferentialTests --gtest_color=no > /dev/null 2>&1; echo "diff exit=$?"'
  - test -f .github/workflows/ci.yml
  - git log --oneline -3

risk: medium
