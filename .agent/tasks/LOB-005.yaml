constraints:
  - Zero behavior change: public API, semantics.md semantics, fill events, snapshot output all identical
  - Every Order/Limit allocation and deallocation site routes through the pools (grep-clean: no `new Order`, `new Limit`, `delete order`, `delete limit` patterns left in engine sources)
  - Pools never move live objects (address stability); capacity growth allowed and documented
  - Existing tests must stay green untouched; no edits to reference/, bench/, tools/, test/
  - Do not change CMake test targets; only add the Pool sources to the library target if needed

acceptance:
  - All three test suites pass under Release and UBSan (differential incl. I1-I7 against the pooled engine)
  - Grep shows zero direct new/delete of Order/Limit in Limit_Order_Book/
  - Bench alloc counters show the per-op allocation reduction on fill_dense/add_cancel_dense/level_churn (numbers recorded in the commit or results/stageD/)
  - Remaining allocation sources documented (map nodes, sink vector, chunk growth)
  - Honest performance statement: measured deltas per load, including any load with no gain

