name: ci

# Build + correctness + sanitizers on Linux. NO performance gates: shared CI
# hosts have noisy perf; benchmarks are local artifacts (results/stageC, stageD).

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        config:
          - name: release
            build_type: Release
            cxx_flags: ""
          - name: ubsan
            build_type: Debug
            cxx_flags: "-fsanitize=undefined -fno-omit-frame-pointer"
          - name: asan-lsan
            build_type: Debug
            cxx_flags: "-fsanitize=address,undefined -fno-omit-frame-pointer"
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=${{ matrix.config.build_type }} -DCMAKE_CXX_FLAGS="${{ matrix.config.cxx_flags }}"

      - name: Build
        run: cmake --build build -j2

      - name: Unit suites (upstream + engine correctness)
        run: |
          ./build/test/LimitOrderBookTests --gtest_color=no
          ./build/test/EngineCorrectnessTests --gtest_color=no

      - name: Differential suite (reference model vs engine, 20 seeds, I1-I7)
        run: ./build/test/DifferentialTests --gtest_color=no
        env:
          ASAN_OPTIONS: detect_leaks=1

      - name: Deterministic replay golden checks
        run: |
          set -e
          for g in testdata/golden/*.golden; do
            c="${g%.golden}"
            ./build/tools/replay --replay "$c" --golden "$g"
          done

      # Deterministic output: replay the same corpus twice and diff the records.
      - name: Replay determinism smoke
        run: |
          ./build/tools/replay --replay testdata/corpora/mix-heavy.txt > /tmp_a.txt 2>/dev/null || true
          ./build/tools/replay --replay testdata/corpora/mix-heavy.txt > /tmp_b.txt 2>/dev/null || true
          diff /tmp_a.txt /tmp_b.txt
